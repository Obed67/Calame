name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: Créer le tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v1.0.${{ github.run_number }}"
          git push origin "v1.0.${{ github.run_number }}"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publier la release
        shell: bash
        run: |
          tag="v1.0.${{ github.run_number }}"
          notes=$(gh api --method POST repos/Obed67/Calame/releases/generate-notes -f tag_name="$tag" --jq .body)
          gh release create "$tag" \
            "release/Calame-${tag#v}-setup.exe" \
            "release/Calame-${tag#v}-portable.exe" \
            --repo Obed67/Calame \
            --title "$tag" \
            --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
